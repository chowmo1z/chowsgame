                    <div className="w-8 h-6 bg-[#ffdbac] relative z-20 -mt-2">${state.assets.chain && html`<div className="absolute top-3 left-[-12px] right-[-12px] h-10 rounded-b-full border-b-[6px] drop-shadow-lg" style=${{ borderColor: state.assets.chain.color }} />`}</div>
                    <div className="flex flex-col items-center -space-y-4">

        const ChowTokComponent = ({ stats, onBuyPromo }) => html`

                            <div className="text-center"><div className="font-black text-xl">${stats.likes.toLocaleString()}</div><div className="text-[9px] uppercase opacity-50">Likes</div></div>

                </div>

        `;

        const ChowTubeComponent = ({ subscribers }) => html`
            <div className="h-full bg-zinc-900 flex flex-col">
                <div className="p-4 border-b border-white/10 flex items-center justify-between"><div className="font-black italic text-red-500 flex items-center gap-2"><${Lucide.PlaySquare} /> ChowTube</div><div className="text-[10px] font-bold">${subscribers.toLocaleString()} Subs</div></div>
                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    ${[1,2,3].map(i => html`

                            <div className="w-full aspect-video bg-black rounded-xl relative flex items-center justify-center group"><div className="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center group-active:scale-90 transition-transform"><${Lucide.Play} fill="white" size=${20} /></div></div>
                            <div className="flex gap-3">
                                <div className="w-8 h-8 rounded-full bg-blue-500"></div>

                    `)}

        function App() {
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : getInitialState();
            });

            const [shopTab, setShopTab] = useState('phones');
            const [academyTab, setAcademyTab] = useState('education');
            const [phoneApp, setPhoneApp] = useState(null);
            const [phoneFolder, setPhoneFolder] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [isSignInModalOpen, setSignInModalOpen] = useState(false);
            const [signInName, setSignInName] = useState('');
            const [signInEmail, setSignInEmail] = useState('');
            const [appStoreCategory, setAppStoreCategory] = useState('All');
            const [controlCenterOpen, setControlCenterOpen] = useState(false);

            useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }, [state]);

            // --- UTILS ---
            const log = (msg, serious = false) => {
                const id = Date.now();
                setState(p => ({ 
                    ...p, 
                    notifications: [{ id, msg, serious }, ...p.notifications].slice(0, 5),
                    logs: [{ id, msg, type: serious ? 'error' : 'info' }, ...p.logs].slice(0, 4)
                }));
                setTimeout(() => setState(p => ({...p, notifications: p.notifications.filter(n => n.id !== id)})), 3000);
            };

            const callAI = async (text) => {
                if (!text.trim()) return;
                const userMsg = { role: 'user', text };
                setState(p => ({ ...p, aiChat: [...p.aiChat, userMsg] }));
                
                try {
                    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                    const response = await ai.models.generateContent({
                        model: 'gemini-2.5-flash-latest',
                        contents: text,
                        config: { systemInstruction: "You are Chow AI, a helpful, sassy, and cool AI assistant on a simulated phone inside a life simulation game called Chow Sim." }
                    });
                    const reply = response.text;
                    setState(p => ({ ...p, aiChat: [...p.aiChat, { role: 'model', text: reply }] }));
                } catch (e) {
                    setState(p => ({ ...p, aiChat: [...p.aiChat, { role: 'model', text: "Connection error. Please try again." }] }));
                }
            };

            // --- GAME LOOP ---
            const grind = () => { 
                if(state.isDead) return;
                // Random Events
                const eventRoll = Math.random();
                if (eventRoll < 0.05) { log('Found £50 on the street!', false); setState(p => ({...p, money: p.money + 50})); }
                else if (eventRoll < 0.10) { log('Got Mugged! Lost £20', true); setState(p => ({...p, money: Math.max(0, p.money - 20)})); }
                else if (eventRoll < 0.15) { log('Caught a cold! -5 HP', true); setState(p => ({...p, health: Math.max(0, p.health - 5)})); }

                let nextWeek = state.week + 1;
                let nextAge = state.age;
                if(nextWeek > 52) { nextWeek = 1; nextAge++; }
                let newHealth = Math.max(0, state.health - 3);
                let newHappy = Math.max(0, state.happiness - 3);
                
                if (state.age >= 16 && !state.assets.house) { newHealth--; newHappy--; }

                let currentMoney = state.money;
                let jobUpdate = state.job ? { ...state.job } : null;

                if (jobUpdate) {
                    const perfChange = Math.floor(Math.random() * 15) - 5;
                    jobUpdate.performance = Math.min(100, Math.max(0, (jobUpdate.performance || 50) + perfChange));
                    if (jobUpdate.performance >= 100) {
                        jobUpdate.salary = Math.floor(jobUpdate.salary * 1.2);
                        jobUpdate.performance = 50;
                        log("PROMOTED! Salary increased to £" + jobUpdate.salary, true);
                    } else if (jobUpdate.performance <= 0) {
                        log("FIRED! Performance dropped to 0.", true);
                        jobUpdate = null;
                    }
                }
                if (jobUpdate) currentMoney += jobUpdate.salary;
                else if (!state.job) currentMoney += 20;

                setState(p => ({ 
                    ...p, 
                    week: nextWeek, 
                    age: nextAge, 
                    money: currentMoney, 
                    health: newHealth, 
                    happiness: newHappy, 
                    job: jobUpdate,
                    isDead: newHealth <= 0 || newHappy <= 0 
                }));
                log(jobUpdate ? `Worked 1 Week. Earned £${jobUpdate.salary}` : 'Scavenged 1 Week. Earned £20');
            };

            // --- ACTIONS ---
            const applyJob = (j) => {
                if(state.age < j.minAge) return log('Too young', true); 
                
                // Requirement check (Level / 1000)
                if (j.reqSubject) {
                    const currentLevel = state.education.subjects[j.reqSubject] || 0;
                    if (currentLevel < j.reqLevel) return log(`Req ${j.reqSubject} level ${j.reqLevel}/1000`, true);
                }

                if(j.reqStyle && state.style < j.reqStyle) return log(`Needs ${j.reqStyle} Style`, true);

                // Background Check for jobs > 500 salary
                if (j.salary > 500) {
                    if (state.jobCooldowns[j.id] && state.jobCooldowns[j.id] > state.week) return log(`Application Cooldown (${state.jobCooldowns[j.id] - state.week} wks)`, true);
                    if (state.policeRecord > 5) {
                        log("REJECTED: Criminal Record. Try again in 5 weeks.", true);
                        setState(p => ({...p, jobCooldowns: {...p.jobCooldowns, [j.id]: p.week + 5}}));
                        return;
                    }
                }

                setState(p => ({...p, job: { ...j, performance: 50 }})); 
                log('Hired as ' + j.name, true); 
            };

            const study = (type, subject = null) => {
                if(state.isDead) return;
                if (type === 'subject') {
                    if (state.education.secondary < 60) return log('Complete Secondary School first!', true);
                    if (state.education.subjects[subject] >= 1000) return;
                    if (state.money < 10) return log('Need £10', true);
                    setState(p => ({ 
                        ...p, 
                        money: p.money - 10, 
                        education: { ...p.education, subjects: { ...p.education.subjects, [subject]: Math.min(1000, (p.education.subjects[subject] || 0) + 20) } } 
                    }));
                    log(`Studied ${subject} (+20)`, true);
                } else if (type === 'primary') {
                    if (state.education.primary >= 60) return;
                    setState(p => ({ ...p, money: p.money + 10, education: { ...p.education, primary: Math.min(60, p.education.primary + 5) } }));
                    log('Primary Education +5%', true);
                } else if (type === 'secondary') {
                    if (state.education.secondary >= 60) return;
                    if (state.education.primary < 60) return log('Complete Primary first!', true);
                    setState(p => ({ ...p, money: p.money + 5, education: { ...p.education, secondary: Math.min(60, p.education.secondary + 5) } }));
                    log('Secondary Education +5%', true);
                }
            };

            const purchase = (category, item) => {
                if (category === 'wellness') {
                    if (state.money < item.price) return log('No Funds!', true);
                    setState(p => ({ ...p, money: p.money - item.price, health: Math.min(100, p.health + item.health), happiness: Math.min(100, p.happiness + item.happy) }));
                    log('Used ' + item.name, true);
                    return;
                }
                if (state.assets[category]?.id === item.id) return log('Equipped ' + item.name, false);
                const owned = state.ownedAssets.find(o => o.id === item.id);
                if (owned) {
                    setState(p => {
                         const newAssets = { ...p.assets, [category]: item };
                         const newStyle = ['top', 'bottom', 'head'].reduce((acc, c) => acc + (newAssets[c]?.style || 0), 0);
                         return { ...p, style: newStyle, assets: newAssets };
                    });
                    log('Equipped: ' + item.name, true);
                    return;
                }
                if (state.money < item.price) return log('No Funds!', true);
                
                setState(p => {
                    const newAssets = { ...p.assets, [category]: item };
                    const newStyle = ['top', 'bottom', 'head'].reduce((acc, c) => acc + (newAssets[c]?.style || 0), 0);
                    return { ...p, money: p.money - item.price, style: newStyle, assets: newAssets, ownedAssets: [...p.ownedAssets, item] };
                });
                log('Purchased: ' + item.name, true);
                if (category === 'phone') setState(p => ({...p, phoneLocked: true, phonePin: '2580'}));
            };

            const steal = (item, type) => {
                const chance = item.price > 5000 ? 0.9 : 0.3;
                if (Math.random() < chance) { 
                    setState(p => ({...p, policeRecord: p.policeRecord + 1, jail: { isJailed: true, clicks: 20 }})); 
                    log('BUSTED! Record +1', true);
                } else { 
                    setState(p => ({ ...p, assets: { ...p.assets, [type]: item }, ownedAssets: [...p.ownedAssets, item] })); 
                    log('Stole: ' + item.name + '!', true);
                }
            };

            // --- UI RENDERERS ---
            const APP_FOLDERS = [
                { id: 'f1', name: 'Social', apps: ['ChowSapp', 'ChowReviews', 'ChowTube', 'ChowTok'], icon: Lucide.Users, color: 'bg-green-500/20' },
                { id: 'f2', name: 'Tools', apps: ['ChowBank', 'Chow AI', 'Chow Settings'], icon: Lucide.Tool, color: 'bg-blue-500/20' },
                { id: 'f3', name: 'Games', apps: ['ChowGame'], icon: Lucide.Play, color: 'bg-orange-500/20' }
            ];

            const isCritical = (state.health <= 15 || state.happiness <= 15) && !state.isDead;
            const showCriticalWarning = isCritical && !(view === 'shop' && shopTab === 'wellness');

            if (state.isDead) return html`<div className="fixed inset-0 z-[60] bg-red-900/90 flex flex-col items-center justify-center p-10 text-center space-y-8 animate-in fade-in duration-1000"><div className="text-9xl">💀</div><h1 className="text-7xl font-black text-white italic tracking-tighter uppercase">WASTED</h1><button onClick=${() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} className="px-12 py-5 bg-white text-black rounded-full font-black text-2xl shadow-2xl active:scale-95 transition-transform">START OVER</button></div>`;

            if (state.jail.isJailed) return html`
                <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-8 text-center space-y-8 animate-in zoom-in duration-300">
                    <div className="text-7xl animate-bounce">🚓</div>
                    <h1 className="text-5xl font-black text-red-600 italic uppercase">BUSTED!</h1>
                    <div className="text-3xl font-black tracking-widest text-zinc-500">${state.jail.clicks} STEPS TO FREEDOM</div>
                    <button onClick=${() => setState(p => ({...p, health: p.health - 2, jail: {...p.jail, clicks: p.jail.clicks - 1, isJailed: p.jail.clicks > 1}}))} className="w-full py-8 bg-red-600 rounded-[40px] font-black text-3xl shadow-xl active:scale-95">ESCAPE (-2 HP)</button>
                    <div className="w-full bg-zinc-800 h-3 rounded-full overflow-hidden border border-white/10"><div className="h-full bg-red-500 transition-all duration-300" style=${{width: `${state.health}%`}} /></div>
                </div>
            `;

            if (!state.hasStarted) return html`

                    <h1 className="text-6xl font-black italic mb-8 text-blue-500 tracking-tighter text-center">CHOW SIM</h1>
                    <div className="w-full max-w-sm space-y-6 bg-zinc-900/80 p-8 rounded-[40px] border border-white/10 shadow-2xl backdrop-blur-xl">
                        <input className="w-full bg-white/5 p-4 rounded-[20px] text-center font-black uppercase text-white outline-none border border-white/5 focus:border-blue-500 transition-colors mt-1" placeholder="ENTER NAME" value=${state.name} onChange=${e => setState(p => ({...p, name: e.target.value}))} />
                        <div className="flex gap-2 mt-1">
                            <button onClick=${() => setState(p => ({...p, gender: 'male', avatarId: 'm1'}))} className=${`flex-1 py-4 rounded-[20px] font-black uppercase text-xs ${state.gender === 'male' ? 'bg-blue-600 text-white' : 'bg-white/5 text-white/30'}`}>MALE</button>
                            <button onClick=${() => setState(p => ({...p, gender: 'female', avatarId: 'f1'}))} className=${`flex-1 py-4 rounded-[20px] font-black uppercase text-xs ${state.gender === 'female' ? 'bg-pink-600 text-white' : 'bg-white/5 text-white/30'}`}>FEMALE</button>
                        </div>
                        <div className="grid grid-cols-5 gap-2 mt-2">
                            ${AVATARS[state.gender].map(av => html`<button key=${av.id} onClick=${() => setState(p => ({...p, avatarId: av.id}))} className=${`aspect-square rounded-full border-2 flex items-center justify-center relative overflow-hidden bg-[#ffdbac] ${state.avatarId === av.id ? 'border-blue-500 scale-110 shadow-lg' : 'border-transparent opacity-50'}`}><div className="scale-[0.4] origin-top translate-y-2">${av.render()}</div></button>`)}
                        </div>
                        <button className="w-full bg-white text-black p-5 rounded-[25px] font-black text-xl uppercase italic shadow-2xl active:scale-95 transition-transform mt-4" onClick=${() => state.name && setState(p => ({...p, hasStarted: true}))}>START LIFE</button>
                    </div>
                </div>
            `;

            return html`
                <div className="min-h-screen flex flex-col relative text-white bg-black">
                    ${showCriticalWarning && html`<div className="fixed inset-0 z-[60] bg-red-900/95 flex flex-col items-center justify-center p-8 text-center animate-pulse"><h1 className="text-6xl font-black text-white italic uppercase mb-4">⚠️ WARNING ⚠️</h1><div className="text-4xl font-black text-white mb-8">CRITICAL CONDITION</div><div className="text-2xl font-bold text-red-200 mb-8 max-w-md">5 WEEKS LEFT<br/>HEAL YOURSELF IMMEDIATELY</div><button onClick=${() => { setView('shop'); setShopTab('wellness'); }} className="px-10 py-6 bg-white text-red-900 rounded-full font-black text-2xl uppercase shadow-2xl active:scale-95 transition-transform">GO TO WELLNESS</button></div>`}

                    <header className="px-6 pt-12 pb-4 glass sticky top-0 z-40 border-b border-white/5 flex justify-between items-center backdrop-blur-3xl">
                        <div><div className="text-2xl font-black tracking-tighter uppercase italic truncate max-w-[150px]">${state.name}</div><div className="text-[10px] opacity-40 font-black tracking-widest">AGE ${state.age} / WEEK ${state.week}</div></div>
                        <div className="flex flex-col items-end gap-1.5">
                            <div className="text-2xl font-black text-emerald-500 italic leading-none">£${state.money.toLocaleString()}</div>
                            <div className="flex items-center gap-1.5"><div className="w-24 bg-zinc-800 rounded-full h-4 relative overflow-hidden border border-white/10"><div className="h-full bg-blue-500 transition-all duration-500" style=${{width: `${state.health}%`}}></div></div><div className="bg-red-500 p-1 rounded-lg shadow-lg"><${Lucide.Heart} size=${12} fill="white" /></div></div>
                            <div className="flex items-center gap-1.5"><div className="w-24 bg-zinc-800 rounded-full h-4 relative overflow-hidden border border-white/10"><div className="h-full bg-yellow-400 transition-all duration-500" style=${{width: `${state.happiness}%`}}></div></div><div className="bg-yellow-400 p-1 rounded-lg shadow-lg"><${Lucide.Smile} size=${12} /></div></div>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto p-5 pb-40 no-scrollbar">
                        ${view === 'home' && html`<div className="space-y-6">
                            <div className="glass p-12 rounded-[60px] flex flex-col items-center ios-shadow border border-white/5">
                                <${CharacterVisual} state=${state} scale=${1.4} onGrind=${grind} />
                                <div className="text-lg font-black mt-10 px-12 py-4 glass rounded-full shadow-2xl border border-white/10 uppercase italic tracking-widest text-blue-400">${state.job ? state.job.name : 'STREET LIVING'}</div>
                                ${state.job && html`<div className="w-full max-w-[200px] mt-4 space-y-1"><div className="flex justify-between text-[8px] font-black uppercase opacity-60"><span>Performance</span><span>${state.job.performance || 50}%</span></div><div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden border border-white/5"><div className="h-full bg-purple-500 transition-all duration-300" style=${{width: `${state.job.performance || 50}%`}} /></div></div>`}
                            </div>
                            <div className="space-y-2">${state.logs.map(l => html`<div key=${l.id} className="p-4 glass rounded-3xl text-[10px] font-bold italic border border-white/5"><span className=${l.type === 'error' ? 'text-red-500' : 'text-emerald-500'}>▶ </span> ${l.msg}</div>`)}</div>
                        </div>`}

                        ${view === 'academy' && html`<div className="space-y-6">
                            <div className="flex gap-2"><button onClick=${() => setAcademyTab('education')} className=${`flex-1 py-3 rounded-2xl font-black text-xs uppercase ${academyTab === 'education' ? 'bg-white text-black' : 'glass'}`}>Education</button><button onClick=${() => setAcademyTab('jobs')} className=${`flex-1 py-3 rounded-2xl font-black text-xs uppercase ${academyTab === 'jobs' ? 'bg-white text-black' : 'glass'}`}>Jobs</button></div>
                            ${academyTab === 'education' ? html`<div className="space-y-4">
                                <div className="glass p-6 rounded-[35px] border border-white/5 flex justify-between items-center"><div><div className="font-black text-lg">Primary</div><div className="text-[10px] opacity-40 uppercase font-black text-emerald-400">Max 60%</div></div><button onClick=${() => study('primary')} className="px-6 py-2 bg-blue-600 rounded-full font-black text-[10px]" disabled=${state.education.primary >= 60}>${state.education.primary >= 60 ? 'FINISHED' : `STUDY (${state.education.primary}/60)`}</button></div>
                                <div className="glass p-6 rounded-[35px] border border-white/5 flex justify-between items-center"><div><div className="font-black text-lg">Secondary</div><div className="text-[10px] opacity-40 uppercase font-black text-emerald-400">Max 60%</div></div><button onClick=${() => study('secondary')} className="px-6 py-2 bg-indigo-600 rounded-full font-black text-[10px]" disabled=${state.education.secondary >= 60}>${state.education.secondary >= 60 ? 'FINISHED' : `STUDY (${state.education.secondary}/60)`}</button></div>
                                <div className="grid grid-cols-2 gap-3 mt-4">${SUBJECTS.map(s => html`<button key=${s} onClick=${() => study('subject', s)} disabled=${state.education.subjects[s] >= 1000} className="p-5 glass rounded-[30px] text-left border border-white/5 disabled:opacity-50"><div className="text-xs font-black uppercase tracking-tighter">${s}</div><div className="text-[9px] opacity-40 uppercase font-black text-red-400">-£10 / +20%</div><div className="text-[9px] font-bold text-blue-400">${state.education.subjects[s] >= 1000 ? 'MAX' : `${state.education.subjects[s]}/1000`}</div></button>`)}</div>
                            </div>` : html`<div className="space-y-4">${JOBS.map(j => html`<button key=${j.id} onClick=${() => applyJob(j)} className="p-6 glass rounded-[35px] w-full text-left border border-white/5"><div className="flex justify-between items-center"><div className="font-black text-lg italic uppercase">${j.name}</div><div className="text-emerald-500 font-black">£${j.salary}/WK</div></div><div className="text-[9px] opacity-50 uppercase mt-1 font-black flex gap-2"><span>${j.reqSubject ? j.reqSubject.slice(0,3) : 'NONE'} ${j.reqLevel}/1000</span></div></button>`)}</div>`}
                        </div>`}

                        ${view === 'shop' && html`<div className="space-y-6">
                            <div className="flex gap-2 overflow-x-auto pb-4 no-scrollbar">${['clothing', 'phones', 'houses', 'cars', 'chains', 'rings', 'wellness', 'time'].map(t => html`<button key=${t} onClick=${() => setShopTab(t)} className=${`px-6 py-2 rounded-full font-black text-[10px] uppercase tracking-widest transition-all ${shopTab === t ? 'bg-white text-black scale-105' : 'glass opacity-50'}`}>${t}</button>`)}</div>
                            <div className="grid gap-4">
                                ${shopTab === 'time' && html`<button onClick=${() => { setState(p => ({...p, week: p.week + 5})); log('Skipped 5 weeks'); }} className="p-10 glass rounded-[40px] flex flex-col items-center justify-center border border-white/10 bg-red-900/10 shadow-2xl active:scale-95 transition-transform"><${Lucide.Clock} size=${48} className="mb-4 text-red-500" /><div className="font-black text-xl uppercase italic">SKIP 5 WEEKS</div></button>`}
                                ${shopTab === 'wellness' ? WELLNESS.map(w => html`<button key=${w.id} onClick=${() => purchase('wellness', w)} className="p-6 glass rounded-[40px] flex justify-between items-center border border-white/5 shadow-xl"><div><div className="font-black uppercase italic">${w.name}</div><div className="text-[10px] opacity-50 font-black text-emerald-400">+${w.health} HP / +${w.happy} HAPPY</div></div><div className="text-emerald-500 font-black">£${w.price}</div></button>`) : 
                                (shopTab === 'clothing' ? CLOTHING : shopTab === 'phones' ? PHONES : shopTab === 'cars' ? CARS : shopTab === 'houses' ? HOUSES : shopTab === 'chains' ? CHAINS : shopTab === 'rings' ? RINGS : []).map(i => i && html`
                                    <div key=${i.id} className="p-6 glass rounded-[40px] flex justify-between items-center border border-white/5 shadow-xl transition-all">
                                        <div><div className="font-black italic uppercase text-sm">${i.name}</div><div className="text-[10px] opacity-40 font-black tracking-widest flex gap-2"><span>£${i.price.toLocaleString()}</span> ${i.style ? html`<span className="text-pink-400">+${i.style} STYLE</span>` : ''}</div></div>
                                        <div className="flex gap-2">
                                            <button onClick=${() => steal(i, i.type || shopTab.slice(0, -1))} className="px-3 py-2 bg-red-900/40 rounded-full font-black text-[8px] text-red-300 border border-red-500/20">STEAL</button>
                                            <button onClick=${() => purchase(i.type || shopTab.slice(0, -1), i)} className="px-6 py-2 bg-emerald-600 rounded-full font-black text-[10px] uppercase min-w-[80px]">${state.assets[i.type || shopTab.slice(0, -1)]?.id === i.id ? 'OWNED' : (state.ownedAssets.find(o => o.id === i.id) ? 'TAKE' : 'BUY')}</button>
                                        </div>
                                    </div>`)}
                            </div>
                        </div>`}

                        ${view === 'phone' && html`<div className=${`h-full rounded-[45px] overflow-hidden ${state.phoneBg} transition-all relative border-[6px] border-zinc-900 shadow-2xl flex flex-col`}>
                            <!-- Swipe Down Notification Center Handle -->
                            <div className="absolute top-0 w-full h-6 z-[80] flex justify-center cursor-pointer" onClick=${() => setControlCenterOpen(!controlCenterOpen)}><div className="w-10 h-1 bg-white/30 rounded-full mt-2" /></div>
                            
                            ${controlCenterOpen && html`<div className="absolute inset-0 bg-black/80 backdrop-blur-xl z-[75] p-6 animate-in slide-in-from-top duration-300 flex flex-col space-y-4 pt-12">
                                <h3 className="text-white font-black text-xl">Control Center</h3>
                                <div className="grid grid-cols-4 gap-4">
                                    <button className="aspect-square bg-zinc-800 rounded-xl flex items-center justify-center text-white"><${Lucide.Wifi} /></button>
                                    <button className="aspect-square bg-zinc-800 rounded-xl flex items-center justify-center text-white"><${Lucide.Bluetooth} /></button>
                                    <button className="aspect-square bg-blue-600 rounded-xl flex items-center justify-center text-white"><${Lucide.Plane} /></button>
                                    <button className="aspect-square bg-zinc-800 rounded-xl flex items-center justify-center text-white"><${Lucide.Moon} /></button>
                                </div>
                                <div className="space-y-2">
                                    <div className="text-xs uppercase font-black opacity-50">Notifications</div>
                                    ${state.notifications.map(n => html`<div className="p-3 bg-zinc-800 rounded-xl text-xs font-bold flex justify-between"><span>${n.msg}</span><span className="opacity-50">Now</span></div>`)}
                                </div>
                                <button onClick=${() => setControlCenterOpen(false)} className="mt-auto py-4 w-full bg-white text-black rounded-xl font-black text-xs uppercase">Close</button>
                            </div>`}

                            ${state.phoneLocked ? html`
                                <div className="flex-1 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md p-10 z-[60]">
                                    <div className="mb-10 text-4xl font-black italic">ENTER PIN</div>
                                    <div className="flex gap-4 mb-10">${[0,1,2,3].map(i => html`<div key=${i} className=${`w-4 h-4 rounded-full border-2 border-white ${pinInput.length > i ? 'bg-white' : ''}`} />`)}</div>
                                    <div className="grid grid-cols-3 gap-6 w-full max-w-[240px]">
                                        ${[1,2,3,4,5,6,7,8,9].map(n => html`<button key=${n} onClick=${() => {
                                            const next = pinInput + n;
                                            setPinInput(next);
                                            if (next.length === 4) {
                                                if(next === state.phonePin) { setState(p => ({...p, phoneLocked: false})); setPinInput(''); }
                                                else { setPinInput(''); log('Incorrect PIN (Hint: 2580)', true); }
                                            }
                                        }} className="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-2xl font-bold active:bg-white/30 transition-colors">${n}</button>`)}
                                        <div />
                                        <button onClick=${() => {
                                            const next = pinInput + '0';
                                            setPinInput(next);
                                            if (next.length === 4) {
                                                if(next === state.phonePin) { setState(p => ({...p, phoneLocked: false})); setPinInput(''); }
                                                else { setPinInput(''); log('Incorrect PIN (Hint: 2580)', true); }
                                            }
                                        }} className="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-2xl font-bold active:bg-white/30 transition-colors">0</button>
                                    </div>
                                    <div className="mt-8 text-[10px] opacity-30 font-black">SECURE ENCLAVE</div>
                                </div>
                            ` : (!phoneApp ? html`<div className="p-8 h-full flex flex-col items-center">
                                <div className="mt-8 text-6xl font-thin tracking-tighter italic text-white drop-shadow-lg mb-10">14:20</div>
                                <div className="grid grid-cols-4 gap-4 w-full">
                                    ${APP_FOLDERS.map(folder => html`<button key=${folder.id} onClick=${() => setPhoneFolder(folder)} className="flex flex-col items-center gap-1.5 group">
                                        <div className=${`w-14 h-14 rounded-3xl ${folder.color} flex flex-wrap p-2 gap-1.5 backdrop-blur-md group-active:scale-90 transition-transform`}>
                                            ${folder.apps.filter(appName => state.installedApps.includes(appName)).slice(0, 4).map(appName => {
                                                const a = APPS.find(app => app.name === appName) || { color: 'bg-zinc-600' };
                                                return html`<div key=${appName} className=${`w-4 h-4 rounded-sm ${a.color}`} />`;
                                            })}
                                        </div>
                                        <span className="text-[9px] font-black uppercase text-white drop-shadow-md tracking-tighter">${folder.name}</span>
                                    </button>`)}
                                    <button onClick=${() => setPhoneApp('App Store')} className="flex flex-col items-center gap-1.5 group">
                                        <div className="w-14 h-14 rounded-3xl bg-blue-500 flex items-center justify-center shadow-lg group-active:scale-90 transition-transform"><${Lucide.ShoppingBag} size={24} /></div>
                                        <span className="text-[9px] font-black uppercase text-white drop-shadow-md tracking-tighter">Market</span>
                                    </button>
                                </div>
                                ${phoneFolder && html`<div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-2xl flex items-center justify-center p-6 animate-in fade-in duration-200" onClick=${() => setPhoneFolder(null)}>
                                    <div className="bg-zinc-900/60 p-10 rounded-[50px] w-full max-w-sm border border-white/10 relative shadow-2xl" onClick=${e => e.stopPropagation()}>
                                        <button onClick=${() => setPhoneFolder(null)} className="absolute top-6 right-6 text-white/40"><${Lucide.X} /></button>
                                        <h3 className="text-center font-black text-white uppercase italic mb-10 tracking-widest opacity-50 text-sm">${phoneFolder.name}</h3>
                                        <div className="grid grid-cols-3 gap-10">
                                            ${phoneFolder.apps.filter(appName => state.installedApps.includes(appName)).map(appName => {
                                                const appData = APPS.find(a => a.name === appName) || { icon: Lucide.Box, color: 'bg-gray-500' };
                                                if (appName === 'Chow Settings') appData.icon = Lucide.Settings;
                                                const r = state.appRatings[appName];
                                                return html`<button onClick=${() => { 
                                                    if(appName === 'ChowGame') setState(p => ({...p, hairType: Math.random() > 0.5 ? 'curly' : 'straight'}));
                                                    setPhoneApp(appName); setPhoneFolder(null); 
                                                }} className="flex flex-col items-center gap-3 group relative">
                                                    <div className=${`w-16 h-16 rounded-[24px] flex items-center justify-center shadow-2xl ${appData.color} relative group-active:scale-90 transition-transform`}>
                                                        <${appData.icon} size=${32} />
                                                        ${r > 0 && html`<div className="absolute -top-1 -right-1 bg-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] font-black text-black border-2 border-zinc-900">${r}★</div>`}
                                                    </div>
                                                    <span className="text-[10px] font-black text-white uppercase truncate w-16 text-center">${appName}</span>
                                                </button>`;
                                            })}
                                        </div>
                                    </div>
                                </div>`}

                                <div className="flex-1 overflow-y-auto no-scrollbar relative">
                                    ${phoneApp === 'ChowReviews' && html`<${ChowReviewsComponent} installedApps=${state.installedApps} ratings=${state.appRatings} onRate=${(app, r) => setState(p => ({...p, appRatings: {...p.appRatings, [app]: r}}))} />`}
                                    ${phoneApp === 'App Store' && html`<div className="p-6 space-y-6">
                                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">${['All', 'Social', 'Finance', 'Entertainment', 'Productivity'].map(cat => html`<button onClick=${() => setAppStoreCategory(cat)} className=${`px-5 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${appStoreCategory === cat ? 'bg-white text-black' : 'bg-white/5 opacity-50'}`}>{cat}</button>`)}</div>
                                        <div className="space-y-3">
                                            ${APPS.filter(a => !state.installedApps.includes(a.name) && (appStoreCategory === 'All' || a.category === appStoreCategory)).map(a => html`
                                                <div key=${a.id} className="w-full p-4 glass rounded-[25px] flex items-center justify-between border border-white/5">
                                                    <div className="flex items-center gap-4"><div className=${`w-10 h-10 rounded-xl flex items-center justify-center ${a.color}`}><${a.icon} size=${20} /></div><div className="font-black uppercase text-[10px] italic tracking-widest">${a.name}</div></div>
                                                    <button onClick=${() => {if(state.money < 50) return log('Need £50'); setState(p => ({...p, money:p.money-50, installedApps: [...p.installedApps, a.name]}))}} className="bg-blue-600 text-white px-5 py-2 rounded-full text-[10px] font-black uppercase italic shadow-lg shadow-blue-900/50">GET £50</button>
                                                </div>`)}
                                        </div>
                                        <h3 className="font-black uppercase italic mt-10 text-[10px] tracking-widest opacity-30">Device Styles</h3>
                                        <div className="grid grid-cols-2 gap-3 pb-10">${WALLPAPERS.map(w => html`<button onClick=${() => buyWallpaper(w)} className="p-4 glass rounded-[35px] border border-white/10 flex flex-col items-center gap-3 active:scale-95 transition-transform"><div className=${`w-full h-20 rounded-2xl ${w.class} border border-white/10 shadow-lg`} /><span className="text-[10px] font-black italic">£${w.price}</span></button>`)}</div>
                                    </div>`}
                                    ${phoneApp === 'Chow Settings' && html`<div className="p-6 space-y-4">
                                        ${!state.settings.accountName ? html`<button onClick=${() => setSignInModalOpen(true)} className="w-full p-5 bg-blue-600 rounded-[30px] font-black italic uppercase shadow-xl shadow-blue-900/50 active:scale-95 transition-transform">VERIFY IDENTITY</button>` : html`<div className="p-5 glass rounded-[35px] flex items-center gap-5 border border-blue-500/20"><div className="w-14 h-14 bg-zinc-800 rounded-full flex items-center justify-center font-black text-2xl italic border border-white/5">${state.settings.accountName[0]}</div><div><div className="font-black uppercase italic text-sm">${state.settings.accountName}</div><div className="text-[10px] opacity-40 font-black tracking-widest">${state.settings.accountEmail}</div></div></div>`}
                                        <button onClick=${() => setState(p => ({...p, phoneLocked: true}))} className="settings-btn glass uppercase italic tracking-widest text-[10px]"><${Lucide.Lock} size=${14} /> LOCK DEVICE</button>
                                        <button onClick=${() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} className="settings-btn glass text-red-500 uppercase italic tracking-widest text-[10px]"><${Lucide.Trash2} size=${14} /> WIPE MEMORY</button>
                                        ${isSignInModalOpen && html`<div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-6 backdrop-blur-md"><div className="bg-zinc-900 p-8 rounded-[40px] w-full max-w-sm space-y-5 border border-white/10 shadow-2xl animate-in zoom-in duration-300"><h3 className="font-black text-xl italic uppercase tracking-widest text-center">Cloud Sync</h3><input className="w-full p-5 bg-zinc-800 rounded-3xl text-xs font-black uppercase tracking-widest outline-none border border-white/5" placeholder="DISPLAY NAME" value=${signInName} onChange=${e => setSignInName(e.target.value)} /><input className="w-full p-5 bg-zinc-800 rounded-3xl text-xs font-black uppercase tracking-widest outline-none border border-white/5" placeholder="SECURE EMAIL" value=${signInEmail} onChange=${e => setSignInEmail(e.target.value)} /><div className="flex gap-3 mt-4"><button onClick=${() => setSignInModalOpen(false)} className="flex-1 p-4 bg-zinc-700 rounded-[25px] font-black text-[10px] uppercase">CANCEL</button><button onClick=${performSignIn} className="flex-1 p-4 bg-blue-600 rounded-[25px] font-black text-[10px] uppercase shadow-lg shadow-blue-900/50">SYNC</button></div></div></div>`}
                                    </div>`}
                                    ${phoneApp === 'ChowGame' && html`<div className="p-6"><${ChowGameComponent} onWin=${() => { setState(p => ({...p, money: p.money + 166})); log('MINIGAME SUCCESS! +£166', true); }} /></div>`}
                                    ${phoneApp === 'ChowSapp' && html`<div className="p-6 h-full"><${ChowSappComponent} family=${state.family} friends=${state.friends} addFriend=${() => { setState(p => ({...p, friends: [...p.friends, {name: 'Contact ' + (p.friends.length+1), rel: 10}]})); log('CONNECTED WITH NEW PEER', true); }} style=${state.style} interact=${(tab, contact, type) => { if(type==='money'){ const amt = 50; setState(p=>({...p, money: p.money+amt})); log('SECURED £' + amt, true); } else { log('CHATTED. +REL', true); } }} /></div>`}
                                    ${phoneApp === 'Chow AI' && html`<${ChowAIComponent} messages=${state.aiChat} onSend=${callAI} />`}
                                    ${phoneApp === 'ChowTok' && html`<${ChowTokComponent} stats=${state.chowTok} onBuyPromo=${() => {if(state.money < 500) return log('Need £500'); setState(p => ({...p, money: p.money - 500, chowTok: { ...p.chowTok, followers: p.chowTok.followers + 1000 }})); log('Purchased 1k Subs', true);}} />`}
                                    ${phoneApp === 'ChowTube' && html`<${ChowTubeComponent} subscribers=${state.social.subscribers} />`}
                                    ${phoneApp === 'ChowBank' && html`<div className="p-6 space-y-4">
                                        <div className="p-10 glass rounded-[50px] text-center shadow-2xl border border-white/5"><div className="text-[10px] uppercase opacity-40 font-black tracking-[0.2em] mb-4">CHOW CENTRAL BANK</div><div className="text-4xl font-black text-emerald-400 italic">£${state.bank.balance.toLocaleString()}</div></div>
                                        <div className="grid grid-cols-2 gap-3"><button onClick=${() => { if(state.money < 100) return log('Need £100'); setState(p=>({...p, money:p.money-100, bank:{...p.bank, balance:p.bank.balance+100}})); log('DEPOSITED £100'); }} className="p-5 glass rounded-[35px] font-black text-[10px] uppercase tracking-widest border border-white/10 active:scale-95">DEPOSIT</button><button onClick=${() => { if(state.bank.balance < 100) return log('Insufficient Bank Funds', true); setState(p=>({...p, money:p.money+100, bank:{...p.bank, balance:p.bank.balance-100}})); log('WITHDREW £100'); }} className="p-5 glass rounded-[35px] font-black text-[10px] uppercase tracking-widest border border-white/10 active:scale-95">WITHDRAW</button></div>
                                    </div>`}
                                </div>
                            </div>`)}
                        </div>`}

                        ${view === 'profile' && html`<div className="space-y-6">
                            <div className="flex justify-between items-start">
                                <h2 className="text-4xl font-black italic uppercase italic tracking-tighter">Identity</h2>
                                <div className="flex gap-2">
                                    <div className="bg-pink-600/20 p-4 rounded-[30px] flex flex-col items-center border border-pink-500/50 backdrop-blur-2xl shadow-xl"><${Lucide.Sparkles} size=${28} className="text-pink-400" /><span className="text-[8px] font-black uppercase mt-1 tracking-widest opacity-80">Style ${state.style}</span></div>
                                    <div className="bg-blue-600/20 p-4 rounded-[30px] flex flex-col items-center border border-blue-500/50 backdrop-blur-2xl shadow-xl"><${Lucide.ShieldAlert} size=${28} className="text-blue-400" /><span className="text-[8px] font-black uppercase mt-1 tracking-widest opacity-80">Rec ${state.policeRecord}</span></div>
                                </div>
                            </div>
                            <div className="glass p-8 rounded-[60px] flex justify-center py-16 border border-white/10 shadow-2xl bg-black/40"><${CharacterVisual} state=${state} scale=${1.2} /></div>
                            <div className="glass p-10 rounded-[50px] space-y-6 border border-white/10 shadow-2xl">
                                <h3 className="text-xl font-black italic uppercase tracking-widest opacity-30">Identity Metrics</h3>
                                <div className="space-y-5">
                                    <div className="flex justify-between text-xs font-black uppercase italic tracking-widest"><span>Global Reach</span><span className="text-red-500">${state.social.subscribers.toLocaleString()} SUBS</span></div>
                                    <div className="flex justify-between text-xs font-black uppercase italic tracking-widest"><span>Bank Exposure</span><span className="text-red-500">£${state.bank.debt.toLocaleString()} DEBT</span></div>
                                    <div className="flex justify-between text-xs font-black uppercase italic tracking-widest"><span>Net Assets</span><span className="text-emerald-500">${state.ownedAssets.length} PIECES</span></div>
                                </div>
                            </div>
                        </div>`}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 pb-12 pt-6 px-5 glass border-t border-white/5 flex justify-between items-center backdrop-blur-3xl z-50">
                        <button onClick=${() => setView('academy')} className=${`flex flex-col items-center gap-1.5 transition-all ${view === 'academy' ? 'text-blue-500 scale-110' : 'opacity-30'}`}><${Lucide.GraduationCap} size=${28} /><span className="text-[8px] font-black uppercase tracking-widest">Academy</span></button>
                        <button onClick=${() => { setView('phone'); setPhoneApp(null); }} className=${`flex flex-col items-center gap-1.5 transition-all ${view === 'phone' ? 'text-blue-500 scale-110' : 'opacity-30'}`} disabled=${!state.assets.phone}><${Lucide.Smartphone} size=${28} /><span className="text-[8px] font-black uppercase tracking-widest">Device</span></button>
                        <button onClick=${grind} className="flex flex-col items-center gap-1.5 scale-125 translate-y-[-15px] bg-blue-600 p-5 rounded-full border-2 border-white/20 active:scale-90 transition-all shadow-2xl shadow-blue-900/50"><${Lucide.Zap} size=${30} fill="white"/><span className="text-[8px] font-black uppercase tracking-tighter">PROGRESS</span></button>
                        <button onClick=${() => setView('shop')} className=${`flex flex-col items-center gap-1.5 transition-all ${view === 'shop' ? 'text-blue-500 scale-110' : 'opacity-30'}`}><${Lucide.ShoppingCart} size=${28} /><span className="text-[8px] font-black uppercase tracking-widest">Market</span></button>
                        <button onClick=${() => setView('profile')} className=${`flex flex-col items-center gap-1.5 transition-all ${view === 'profile' ? 'text-blue-500 scale-110' : 'opacity-30'}`}><${Lucide.User} size=${28} /><span className="text-[8px] font-black uppercase tracking-widest">Identity</span></button>
                    </nav>
                </div>
            `;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
